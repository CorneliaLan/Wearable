name: SarcasticCompanion
options:
  bundleIdPrefix: dev.sarcasticcompanion
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L6LA2WNN36
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  # ---------- iPhone ----------
  SarcasticCompanion:
    type: application
    platform: iOS
    sources: [SarcasticCompanion, Shared]
    dependencies:
      - target: SarcasticCompanionWatch   # Watch-App wird in die iPhone-App eingebettet
    entitlements:
      path: SarcasticCompanion/SarcasticCompanion.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: SarcasticCompanion/Info.plist
      properties:
        CFBundleDisplayName: Sarcastic Companion
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [healthkit]
        NSHealthShareUsageDescription: "Die App liest Gesundheitsdaten, um zu testen, ob dieses iPhone sie auslesen kann."
        NSHealthUpdateUsageDescription: "Die App schreibt einen Testwert (Wasser) und Test-Workouts, um die Schreibberechtigung zu prüfen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sarcasticcompanion.SarcasticCompanion
        TARGETED_DEVICE_FAMILY: "1"

  # ---------- Apple Watch ----------
  SarcasticCompanionWatch:
    type: application
    platform: watchOS
    sources: [SarcasticCompanionWatch, Shared]
    entitlements:
      path: SarcasticCompanionWatch/SarcasticCompanionWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: SarcasticCompanionWatch/Info.plist
      properties:
        CFBundleDisplayName: Sarcastic Companion
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.sarcasticcompanion.SarcasticCompanion
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "Die App liest Gesundheitsdaten, um zu testen, ob diese Watch sie auslesen kann."
        NSHealthUpdateUsageDescription: "Die App startet Test-Workouts für die Live-Pulsmessung und schreibt einen Testwert (Wasser)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sarcasticcompanion.SarcasticCompanion.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

# Eindeutige Schemes: "iPhone" startet die iPhone-App, "Watch" die Watch-App
schemes:
  SarcasticCompanion iPhone:
    build:
      targets:
        SarcasticCompanion: all
    run:
      executable: SarcasticCompanion
  SarcasticCompanion Watch:
    build:
      targets:
        SarcasticCompanionWatch: all
    run:
      executable: SarcasticCompanionWatch
